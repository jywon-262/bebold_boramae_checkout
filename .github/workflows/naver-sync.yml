name: Naver Cafe Sync

on:
  # v2(자체 예약 시스템)로 전환하면서 이 자동 스크래핑은 비활성화함.
  # 네이버 로그인 세션(NID_AUT/NID_SES)이 등록돼 있지 않아 5분마다 계속 실패 메일만 보내고 있었음.
  # 필요해지면 아래 schedule 줄의 주석을 풀고 Secrets(SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
  # NAVER_CLUB_ID, NAVER_MENU_ID, NID_AUT, NID_SES)를 등록한 뒤 다시 켤 것.
  # schedule:
  #   - cron: "*/5 * * * *"
  workflow_dispatch: {}       # Actions 탭에서 수동 실행 버튼은 남겨둠 (필요시 테스트용)

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NAVER_CLUB_ID: ${{ secrets.NAVER_CLUB_ID }}
          NAVER_MENU_ID: ${{ secrets.NAVER_MENU_ID }}
          NID_AUT: ${{ secrets.NID_AUT }}
          NID_SES: ${{ secrets.NID_SES }}
        run: python scripts/naver_cafe_sync.py
